name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Pushsafer private key: the logs of the integration do not contain it, but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Pushsafer → Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Pushsafer devices
      description: The platforms of the devices (iOS, Android, Windows, browser…) and the target used (a, a device ID, a group), as shown by "Test the connection". Never the private key.
      placeholder: 'iPhone (iOS 19) and Android, target gs12'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. Hide the texts of the notifications if you wish.
      render: text
